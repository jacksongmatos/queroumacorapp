# Codemagic CI/CD — gera e ASSINA o AAB do Capacitor (o app DEFINITIVO, não o
# WebIntoApp, que é WebView pura sem push/câmera/OAuth nativo).
#
# Setup no painel do Codemagic (não em secret do GitHub):
#   1. Conectar este repositório; o Codemagic detecta este arquivo.
#   2. Code signing identities → Android keystores → subir `my-release-key.jks`
#      (o MESMO que assina o app no Play) com reference name `queroumacor_keystore`,
#      alias e senhas. Isso injeta CM_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD.
#   3. (Opcional, pro push) Environment variables → grupo `firebase` →
#      GOOGLE_SERVICES_JSON = `base64 -w0 google-services.json` (marcar Secure).
#   4. (Deploy na Play) Environment variables → grupo `google_credentials` →
#      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = JSON da service account
#      (Secure). A service account precisa de permissão de Releases no app.
#
# O que a build faz: gera o AAB assinado, MANDA POR E-MAIL e SOBE AUTOMÁTICO na
# faixa `internal` (Internal Testing) da Play. Produção continua MANUAL (a regra
# do projeto: nunca ir direto pra produção — promover Internal→produção na Play
# Console). O versionCode é o maior da Play + 1 (auto), então nunca repete.
#
# Disparo: manual pelo painel (sem bloco `triggering`, não roda a cada push).
# Ver docs/ANDROID_AAB_CODEMAGIC.md.

workflows:
  android-aab:
    name: Android AAB (Capacitor)
    max_build_duration: 60
    # macOS M2 é a única máquina com minutos gratuitos no plano pessoal
    # (500/mês). Linux/Windows não têm cota grátis e exigem assinatura — foi o
    # que fez a primeira build morrer com "instance type is not available with
    # the current billing plan". Android compila normalmente em mac (a imagem
    # traz JDK + Android SDK).
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - queroumacor_keystore
      groups:
        - firebase            # fornece GOOGLE_SERVICES_JSON (opcional, push)
        - google_credentials  # fornece GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (deploy Play)
      node: 20
      java: 17
    cache:
      cache_paths:
        # $HOME e não `~`: o til não é expandido aqui, e o cache virava no-op —
        # na build #3 o "Restoring cache" durou <1s e o `npm ci` levou 7 dos 10
        # minutos.
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      # versionCode = maior build number da Play + 1. Como cada build agora
      # SOBE na Play (publishing.google_play), o número não pode repetir nunca
      # (a Play rejeita duplicata). Sem `--tracks` o CLI devolve o maior de
      # TODAS as tracks; a credencial é lida do env GOOGLE_PLAY_SERVICE_ACCOUNT_
      # CREDENTIALS automaticamente (grupo google_credentials). Guardado: se o
      # CLI falhar (permissão, API), cai no ANDROID_VERSION_CODE manual ou 10202,
      # pra o passo de versão NUNCA derrubar a build. build.gradle lê essa env.
      - name: versionCode = maior da Play + 1
        script: |
          set +e
          LATEST=$(google-play get-latest-build-number --package-name br.com.queroumacor 2>/dev/null)
          RC=$?
          set -e
          if [ $RC -eq 0 ] && echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "Maior versionCode na Play: $LATEST → esta build: $NEXT"
          else
            NEXT="${ANDROID_VERSION_CODE:-10202}"
            echo "get-latest-build-number indisponível (rc=$RC) — fallback versionCode $NEXT"
          fi
          echo "ANDROID_VERSION_CODE=$NEXT" >> $CM_ENV
      - name: Install deps (Capacitor CLI + plugins)
        script: npm ci
      # webDir (next-app/.next/static) não existe em checkout limpo, e o app
      # carrega tudo de server.url — um placeholder basta pro `cap sync` gerar o
      # capacitor.config.json (que aponta pro https://www.queroumacor.com.br).
      - name: Placeholder webDir + Capacitor sync
        script: |
          mkdir -p next-app/.next/static
          echo '<!doctype html><title>QueroUmaCor</title>' > next-app/.next/static/index.html
          npx cap sync android
      - name: google-services.json (se houver)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # openssl em vez de `base64 --decode`: a flag longa é do GNU e o
            # base64 do macOS (onde esta build roda) não a aceita.
            printf '%s' "$GOOGLE_SERVICES_JSON" | openssl base64 -d -A > android/app/google-services.json
            echo "google-services.json escrito (FCM habilitado)."
          else
            echo "SEM GOOGLE_SERVICES_JSON — AAB compila, mas push FCM não registra token."
          fi
      # O build.gradle lê android/key.properties (signingConfig condicional). O
      # Codemagic expõe o keystore em CM_KEYSTORE_PATH + senhas via android_signing.
      - name: key.properties a partir do keystore do Codemagic
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build AAB assinado
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - jackson.guerra@gmail.com
        notify:
          success: true
          failure: true
      # Sobe o AAB direto na faixa `internal` (Internal Testing). `track:
      # internal` respeita a regra "nunca ir direto pra produção" — a promoção
      # Internal→produção continua MANUAL na Play Console. `submit_as_draft:
      # false` = release completo pros testadores internos (não fica em rascunho).
      # A credencial vem do grupo google_credentials.
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
