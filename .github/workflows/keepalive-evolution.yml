# Keep-alive do Evolution API (WhatsApp do portal) no Render FREE.
#
# O plano free do Render dorme o serviço após ~15min sem requests — e com o
# serviço dormindo a CONEXÃO com o WhatsApp cai junto: mensagem recebida só
# chega quando algo o acorda (e a 1ª request pós-sono leva ~50s). Este ping a
# cada 10 minutos mantém o serviço acordado e o WhatsApp conectado o dia todo.
#
# - Agendamento do GitHub é best-effort: pode atrasar alguns minutos em
#   horários de pico, mas 10min de alvo + 15min de tolerância do Render
#   deixam folga.
# - O job NUNCA falha (exit 0 sempre) pra não gerar e-mail de alerta a cada
#   soluço do Render — o status real aparece no log do run.
# - Remover este workflow se migrar o Render pro plano pago (sem sono).
name: keepalive-evolution

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Evolution API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://evolution-api-8arv.onrender.com || echo 'sem-resposta')
          echo "Evolution API respondeu: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "✅ acordado"
          else
            echo "⚠️ resposta inesperada ($code) — provavelmente acordando do sono do Render"
          fi
